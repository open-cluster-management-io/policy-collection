apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-node-image-lifecycle
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration, SI-2 Flaw Remediation
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-kubelet-image-gc
        spec:
          remediationAction: inform
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: machineconfiguration.openshift.io/v1
                kind: KubeletConfig
                metadata:
                  name: image-gc-policy
                spec:
                  machineConfigPoolSelector:
                    matchLabels:
                      pools.operator.machineconfiguration.openshift.io/worker: ""
                  kubeletConfig:
                    imageGCHighThresholdPercent: 65
                    imageGCLowThresholdPercent: 50
                    imageMinimumGCAge: 5m
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-image-prune-timer
        spec:
          remediationAction: inform
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: machineconfiguration.openshift.io/v1
                kind: MachineConfig
                metadata:
                  name: 99-worker-image-gc-prune
                  labels:
                    machineconfiguration.openshift.io/role: worker
                spec:
                  config:
                    ignition:
                      version: 3.2.0
                    storage:
                      files:
                        - path: /usr/local/bin/image-gc-prune.sh
                          mode: 0755
                          contents:
                            source: data:text/plain;charset=utf-8;base64,
                    systemd:
                      units:
                        - name: image-gc-prune.service
                          enabled: false
                          contents: |
                            [Unit]
                            Description=Prune unreferenced container images older than 7 days
                            Wants=crio.service
                            After=crio.service

                            [Service]
                            Type=oneshot
                            ExecStart=/usr/local/bin/image-gc-prune.sh
                        - name: image-gc-prune.timer
                          enabled: true
                          contents: |
                            [Unit]
                            Description=Weekly container image prune

                            [Timer]
                            OnCalendar=Sun *-*-* 02:00:00
                            RandomizedDelaySec=3600
                            Persistent=true

                            [Install]
                            WantedBy=timers.target
