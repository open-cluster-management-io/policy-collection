apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-node-image-lifecycle
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration, SI-2 Flaw Remediation
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-kubelet-image-gc
        spec:
          remediationAction: inform
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: machineconfiguration.openshift.io/v1
                kind: KubeletConfig
                metadata:
                  name: image-gc-policy
                spec:
                  machineConfigPoolSelector:
                    matchLabels:
                      pools.operator.machineconfiguration.openshift.io/worker: ""
                  kubeletConfig:
                    imageGCHighThresholdPercent: 65
                    imageGCLowThresholdPercent: 50
                    imageMinimumGCAge: 5m
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-image-prune-ns
        spec:
          remediationAction: inform
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-image-gc
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-image-prune-rbac
        spec:
          remediationAction: inform
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: image-gc-sa
                  namespace: openshift-image-gc
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: image-gc-node-reader
                rules:
                  - apiGroups: [""]
                    resources: ["nodes"]
                    verbs: ["get", "list"]
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: image-gc-node-reader-binding
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: image-gc-node-reader
                subjects:
                  - kind: ServiceAccount
                    name: image-gc-sa
                    namespace: openshift-image-gc
            - complianceType: musthave
              objectDefinition:
                apiVersion: security.openshift.io/v1
                kind: SecurityContextConstraints
                metadata:
                  name: image-gc-privileged
                allowPrivilegedContainer: true
                allowHostDirVolumePlugin: true
                allowHostPID: false
                allowHostIPC: false
                allowHostNetwork: false
                runAsUser:
                  type: RunAsAny
                seLinuxContext:
                  type: RunAsAny
                fsGroup:
                  type: RunAsAny
                supplementalGroups:
                  type: RunAsAny
                volumes:
                  - hostPath
                  - secret
                  - configMap
                  - projected
                  - downwardAPI
                users:
                  - system:serviceaccount:openshift-image-gc:image-gc-sa
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-image-prune-cronjob
        spec:
          remediationAction: inform
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: batch/v1
                kind: CronJob
                metadata:
                  name: image-gc-prune
                  namespace: openshift-image-gc
                spec:
                  schedule: "0 2 * * 0"
                  concurrencyPolicy: Allow
                  successfulJobsHistoryLimit: 3
                  failedJobsHistoryLimit: 3
                  jobTemplate:
                    spec:
                      backoffLimit: 0
                      template:
                        spec:
                          serviceAccountName: image-gc-sa
                          restartPolicy: Never
                          nodeSelector:
                            node-role.kubernetes.io/worker: ""
                          tolerations:
                            - operator: Exists
                          hostPID: false
                          containers:
                            - name: image-gc
                              image: registry.redhat.io/openshift4/ose-cli:latest
                              command:
                                - /bin/bash
                                - -c
                                - |
                                  MAX_AGE_DAYS=7
                                  echo "Starting image prune on $(hostname) — removing unreferenced images older than ${MAX_AGE_DAYS} days"
                                  NOW=$(date +%s)
                                  CUTOFF=$((NOW - MAX_AGE_DAYS * 86400))
                                  REMOVED=0
                                  SKIPPED=0
                                  REFERENCED=0
                                  for IMG_ID in $(chroot /host crictl images -q); do
                                    REF_COUNT=$(chroot /host crictl ps -a --image "$IMG_ID" -q 2>/dev/null | wc -l)
                                    if [ "$REF_COUNT" -gt 0 ]; then
                                      REFERENCED=$((REFERENCED + 1))
                                      continue
                                    fi
                                    CREATED_TS=$(chroot /host crictl inspecti "$IMG_ID" 2>/dev/null | chroot /host python3 -c "
                                  import sys, json
                                  from datetime import datetime, timezone
                                  try:
                                      d = json.load(sys.stdin)
                                      ts = d.get('info', {}).get('imageSpec', {}).get('created', '')
                                      if not ts:
                                          ts = d.get('status', {}).get('createdAt', '')
                                      if ts:
                                          clean = ts[:26].rstrip('Z') + '+00:00'
                                          try:
                                              dt = datetime.fromisoformat(clean)
                                          except ValueError:
                                              dt = datetime.strptime(ts[:19], '%Y-%m-%dT%H:%M:%S').replace(tzinfo=timezone.utc)
                                          print(int(dt.timestamp()))
                                      else:
                                          print(0)
                                  except Exception:
                                      print(0)
                                  " 2>/dev/null)
                                    CREATED_TS=${CREATED_TS:-0}
                                    if [ "$CREATED_TS" -eq 0 ]; then
                                      SKIPPED=$((SKIPPED + 1))
                                      continue
                                    fi
                                    if [ "$CREATED_TS" -lt "$CUTOFF" ]; then
                                      echo "Removing: $IMG_ID (age=$(( (NOW - CREATED_TS) / 86400 ))d)"
                                      chroot /host crictl rmi "$IMG_ID" 2>&1 || true
                                      REMOVED=$((REMOVED + 1))
                                    else
                                      SKIPPED=$((SKIPPED + 1))
                                    fi
                                  done
                                  echo "Image prune complete: referenced=$REFERENCED removed=$REMOVED skipped=$SKIPPED"
                              securityContext:
                                privileged: true
                              volumeMounts:
                                - name: host
                                  mountPath: /host
                          volumes:
                            - name: host
                              hostPath:
                                path: /
