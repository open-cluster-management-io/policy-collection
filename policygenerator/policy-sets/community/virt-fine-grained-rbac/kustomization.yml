apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    pairs:
      open-cluster-management.io/policy-set: virt-fine-grained-rbac

commonAnnotations:
  argocd.argoproj.io/compare-options: IgnoreExtraneous

resources:
  - input/bootstrap/namespace.yaml

generators:
  - policyGenerator.yaml
