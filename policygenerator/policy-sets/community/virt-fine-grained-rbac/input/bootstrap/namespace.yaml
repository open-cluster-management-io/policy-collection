apiVersion: v1
kind: Namespace
metadata:
  name: policies
---
# Binds this namespace to the default cluster set so Placements here can select
# managed clusters. Change clusterSet if your virt clusters live in another set.
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: default
  namespace: policies
spec:
  clusterSet: default
