# ServiceAccount used by policy-virt-custom-roles-propagate to list custom
# ClusterRoles on the hub. The account must live in the policies namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-virt-hub-clusterroles
  namespace: policies
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-cluster-management:policy-virt-hub-clusterroles
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - roles
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: policy-virt-hub-clusterroles
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-cluster-management:policy-virt-hub-clusterroles
subjects:
  - kind: ServiceAccount
    name: policy-virt-hub-clusterroles
    namespace: policies
